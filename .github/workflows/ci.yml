name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prueba de humo de la interfaz
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          (ALLOW_OPEN_API=1 npx next start -p 3100 &)
          npx wait-on -t 60000 http://localhost:3100/login || sleep 10
          npm run smoke -- --url http://localhost:3100
